name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate tag and bilingual release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
          notes_file="docs/releases/$GITHUB_REF_NAME.md"
          test -s "$notes_file"
          grep -Fxq '## English' "$notes_file"
          grep -Fxq '## 中文' "$notes_file"

      - name: Run repository tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

      - name: Check installer syntax and versions
        run: |
          node --check bin/plan-tree.js
          python -m plan_tree_installer.cli version
          node bin/plan-tree.js version
        env:
          PYTHONPATH: src

  github-release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Create or verify bilingual GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="docs/releases/$GITHUB_REF_NAME.md"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_body="$(mktemp)"
            trap 'rm -f "$release_body"' EXIT
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json body \
              --jq .body > "$release_body"
            grep -Fxq '## English' "$release_body"
            grep -Fxq '## 中文' "$release_body"
            echo "GitHub Release already exists and contains bilingual notes."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --fail-on-no-commits \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes_file"
          fi

  npm:
    name: Publish to npm
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure OIDC-capable npm
        run: npm install --global npm@11.15.0

      - name: Inspect npm package
        run: npm pack --dry-run

      - name: Publish npm package
        run: npm publish --access public

  pypi:
    name: Publish to PyPI
    needs: npm
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build and check Python distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Publish Python distributions
        uses: pypa/gh-action-pypi-publish@release/v1
